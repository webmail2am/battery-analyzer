; Lithium battery analyzer - 3.3 V Pro Mini + AD7705 + 0.96" I2C OLED (SSD1306)
; Open this folder in VS Code with the PlatformIO extension installed.
; Two boards are supported; pick the build that matches the chip marking:
;   LGT8F328P            -> promini_3v3_4mhz   (serial 38400)
;   ATMEGA328P (original) -> promini_3v3        (serial 57600)

[platformio]
default_envs = promini_3v3_4mhz

[env]
platform = atmelavr
framework = arduino
lib_deps =
    greiman/SSD1306Ascii@^1.3.5
monitor_speed = 57600
build_flags = -DINCLUDE_SCROLLING=0
build_src_flags = -Wall

; 3.3 V Pro Mini clone with an LGT8F328P: its CPU runs at 4 MHz (32 MHz / 8), so 8 MHz
; firmware would run at half speed. Serial monitor: 38400 baud.
; Settings use the chip's emulated EEPROM at 0x7800, above the LGT bootloader at 0x7400,
; so the program must stay below 0x7400 = 29696 bytes.
[env:promini_3v3_4mhz]
board = pro8MHzatmega328
board_build.f_cpu = 4000000L
board_upload.maximum_size = 29696
build_flags = ${env.build_flags} -DLGT8F
monitor_speed = 38400

; Original 3.3 V / 8 MHz Pro Mini (ATmega328P). Serial monitor: 57600 baud.
[env:promini_3v3]
board = pro8MHzatmega328
